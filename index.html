<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hinged — The WhatsApp-First Wedding Coordination Hub</title>
    <meta
      name="description"
      content="One link for your wedding. Every guest, every ceremony. WhatsApp-native coordination, tokenized private RSVPs, and household attendee caps designed specifically for multi-day Indian celebrations."
    />
    <meta name="keywords" content="wedding coordination, Indian wedding, RSVP, WhatsApp invite, wedding planner, guest management, open source" />
    <meta property="og:title" content="Hinged — The WhatsApp-First Wedding Coordination Hub" />
    <meta property="og:description" content="Replace the chaos of scattered WhatsApp chats and spreadsheets with a single scoped link for your Indian celebration." />
    <meta property="og:type" content="website" />
    
    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#800020',
                hover: '#660019',
                light: '#9E1B32',
                subtle: 'rgba(128, 0, 32, 0.08)',
              },
              burgundy: {
                950: '#2A0812',
                900: '#4A0E17',
                800: '#800020',
                700: '#9E1B32',
                100: '#FCE7EB',
                50: '#FFF5F6',
              },
              gold: {
                900: '#78350F',
                800: '#92400E',
                600: '#D97706',
                500: '#D4AF37',
                400: '#FBBF24',
                200: '#FDE68A',
                100: '#FEF3C7',
                50: '#FFFBEB',
              },
              ivory: {
                50: '#FDFAF5',
                100: '#FAF7F2',
                200: '#F5EFEB',
                300: '#EFE8DE',
                400: '#E5DCCF',
              },
              foreground: '#231F20',
              muted: '#6B7280',
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #FAF7F2;
        color: #231F20;
      }
      .font-serif {
        font-family: 'Playfair Display', Georgia, serif;
      }
      /* Custom slider thumb */
      input[type=range]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
        background: #800020;
        border: 3px solid #ffffff;
        box-shadow: 0 2px 8px rgba(128, 0, 32, 0.35);
        border-radius: 50%;
        cursor: pointer;
        -webkit-appearance: none;
      }
      input[type=range]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        background: #800020;
        border: 3px solid #ffffff;
        box-shadow: 0 2px 8px rgba(128, 0, 32, 0.35);
        border-radius: 50%;
        cursor: pointer;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #E5DCCF;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="selection:bg-[#800020] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
